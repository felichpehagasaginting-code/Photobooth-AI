name: Daily Natural Activity Automation

on:
  schedule:
    # Runs at 03:00 UTC (10:00 AM WIB) and 13:00 UTC (08:00 PM WIB) every day
    - cron: '0 3,13 * * *'
  workflow_dispatch:

jobs:
  commit-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate natural activity entry
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          MESSAGES=(
            "feat(photobooth): optimize photo strip rendering pipeline"
            "fix(camera): handle media stream reconnect logic"
            "perf(canvas): improve filter preview performance"
            "style(ui): polish modal backdrop and theme accents"
            "docs(activity): update daily activity milestone log"
            "chore(deps): verify automated dependency check"
          )
          RAND_MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}
          echo "- **$TIMESTAMP** - [Auto Activity] $RAND_MSG" >> docs/ACTIVITY_LOG.md
          git add docs/ACTIVITY_LOG.md
          git commit -m "$RAND_MSG"
          git push
